# Build the macOS and Windows installers and attach them to a draft GitHub release.
#
#   git tag v1.1.0 && git push origin v1.1.0     (or run this workflow by hand from the Actions tab)
#
# The release is created as a draft: check it on the Releases page, then press Publish.
#
# A published release (including a pre-release) is public and is never replaced (the user's rule,
# 2026-09-28). The first job checks for one: when publishing a draft created this tag, the run stops
# quietly; when started by hand for a version that is already published, it fails and asks for a new
# version number. Only drafts are ever replaced.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# The program lives in app/; every command runs there.
defaults:
  run:
    working-directory: app

permissions:
  contents: write

jobs:
  check:
    name: Check the version is not already published
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          case "$tag" in v*) ;; *) tag="v$version" ;; esac
          published=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq "[.[] | select((.draft | not) and .tag_name == \"$tag\")] | length")
          if [ "$published" != "0" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "Release $tag is already published; publishing it created this tag. Nothing to build."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Release $tag is already published and is never replaced. Raise the version in app/package.json and build a new draft."
            exit 1
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: check
    if: needs.check.outputs.proceed == 'true'
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build installers
        run: npm run ${{ runner.os == 'macOS' && 'dist:mac' || 'dist:win' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check the package holds no development or user data
        run: npx tsx scripts/check-package.ts
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            app/dist/*.dmg
            app/dist/*.exe
          if-no-files-found: error
          retention-days: 3

  release:
    name: Draft release
    needs: [check, build]
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: app/files
          merge-multiple: true
      - name: Create the draft release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          case "$tag" in v*) ;; *) tag="v$version" ;; esac
          cat > notes.md <<EOF
          PageBinder $version for macOS and Windows.

          - **Mac with Apple silicon (M1 or later):** PageBinder-$version-arm64.dmg
          - **Mac with an Intel processor:** PageBinder-$version-x64.dmg
          - **Windows 10 or 11:** PageBinder-Setup-$version.exe

          Installation steps are in the [README](https://github.com/${GITHUB_REPOSITORY}#download-and-install). The installers are not yet signed, so macOS and Windows ask for confirmation the first time.
          EOF
          ls -la files
          # A rebuild replaces an earlier draft of the same version. Published releases are never touched:
          # the check job has already stopped the run if this version is published.
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.draft and .tag_name == \"$tag\") | .id"); do
            echo "Replacing earlier draft $id"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id"
          done
          gh release create "$tag" files/* --draft --title "PageBinder $version" --notes-file notes.md --target "$GITHUB_SHA"
